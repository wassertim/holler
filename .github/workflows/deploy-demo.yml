name: Deploy Demo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: github.repository_owner == 'wassertim'
    runs-on: ubuntu-latest
    name: Deploy demo to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Inject demo database ID
        run: |
          export DEMO_DB_ID="${{ secrets.DEMO_D1_DATABASE_ID }}"
          sed -i "s|DEMO_D1_DATABASE_ID|${DEMO_DB_ID}|" wrangler.demo.toml

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.61.1'
          command: d1 migrations apply DB --remote --config wrangler.demo.toml

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.61.1'
          command: deploy --config wrangler.demo.toml
